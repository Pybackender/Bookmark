<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود شماره تلفن</title>
</head>
<body>
    <h1>ورود شماره تلفن</h1>
    <form id="phoneForm">
        <label for="phone">شماره تلفن:</label>
        <input type="text" id="phone" name="phone" required>
        <button type="submit">ارسال کد</button>
    </form>

    <script>
        document.getElementById('phoneForm').onsubmit = async function(event) {
            event.preventDefault(); // جلوگیری از ارسال پیش‌فرض فرم

            const phone = document.getElementById('phone').value;

            const response = await fetch('api/check-phone/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ phone: phone }),
            });

            if (response.ok) {
                // اگر ارسال موفقیت‌آمیز بود، به صفحه verify-code بروید
                window.location.href = 'verify-code.html'; // یا به URL مناسب هدایت کنید
            } else {
                const error = await response.json();
                alert(error.detail);
            }
        };
    </script>
</body>
</html>
